name: Package workspace integrity
on:
  push:
    paths:
      - 'apps/proworkspace/packages/**'
      - 'apps/proworkspace/scripts/**'
      - 'apps/proworkspace/package.json'
      - 'apps/proworkspace/package-lock.json'
      - '.github/workflows/package-workspaces.yml'
      - 'SECURITY.md'
  pull_request:
    paths:
      - 'apps/proworkspace/packages/**'
      - 'apps/proworkspace/scripts/**'
      - 'apps/proworkspace/package.json'
      - 'apps/proworkspace/package-lock.json'
      - '.github/workflows/package-workspaces.yml'
      - 'SECURITY.md'
  workflow_dispatch:
jobs:
  clean-package-build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/proworkspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/proworkspace/package-lock.json
      - name: Verify repository security policy
        working-directory: .
        run: test -s SECURITY.md
      - name: Offline source preflight (no registry needed)
        run: npm run verify:source
      - name: Verify public package source contracts
        run: npm run contracts:check
      - name: Verify workspace graph and lockfile
        run: npm run deps:check
      - name: Install exactly locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and verify all workspace exports
        run: npm run build:workspaces
      - name: Verify workspace scripts
        run: npm run test:workspace-tools
      - name: Boot framework HTTP/variable smoke tests
        run: node --test packages/zeruxjs/test/fetch-route.test.mjs packages/zeruxjs/test/services-lifecycle.test.mjs packages/zeruxjs/test/variables.test.mjs
      - name: Verify a second isolated clean checkout
        run: npm run verify:clean

  resolve-and-verify-section66:
    # Manually produce a registry-resolved lockfile without changing the branch.
    # The checkouts/builds are isolated and must ALL pass before the artifact exists.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/proworkspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify repository security policy
        working-directory: .
        run: test -s SECURITY.md
      - name: Resolve, clean install, build and test in isolation
        run: npm run section66:finalize
      - name: Export verified package-lock.json
        uses: actions/upload-artifact@v4
        with:
          name: section66-verified-package-lock
          path: apps/proworkspace/package-lock.json
          if-no-files-found: error
