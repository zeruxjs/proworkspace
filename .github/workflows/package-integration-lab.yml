name: Package integration laboratory (Section 83)

# Deliberately manual: real-service tests consume disposable provider resources.
# A clean install is a prerequisite; a blocked install must fail, not mark suites green.
on:
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Start disposable PostgreSQL/MySQL/MongoDB/Redis/S3/GreenMail fixtures and run real-service suites'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-contracts:
    name: Source-only integrity / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    defaults:
      run:
        working-directory: apps/proworkspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate integration harness without npm downloads
        run: node --test scripts/integration-lab-core.test.mjs
      - name: Verify isolated workspace source contracts
        run: node scripts/integration-lab.mjs --only=source --require=source --report=integration-lab/reports/source.json
      - name: Preserve source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-source-node-${{ matrix.node }}
          path: apps/proworkspace/integration-lab/reports/*.json
          if-no-files-found: ignore

  real-services:
    name: Disposable real providers / Node 22
    if: inputs.run_live == true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/proworkspace
    env:
      ZX_TEST_PG_URL: postgresql://lab:lab_only_not_production@127.0.0.1:55432/zerux_lab
      ZX_TEST_PG_HOST: '127.0.0.1'
      ZX_TEST_PG_PORT: '55432'
      ZX_TEST_MYSQL_HOST: '127.0.0.1'
      ZX_TEST_MYSQL_PORT: '53306'
      ZX_TEST_MYSQL_USER: lab
      ZX_TEST_MYSQL_PASSWORD: lab_only_not_production
      ZX_TEST_MYSQL_DB: zerux_lab
      ZX_TEST_MONGO_URI: mongodb://127.0.0.1:57017
      ZX_TEST_MONGO_HOST: '127.0.0.1'
      ZX_TEST_MONGO_PORT: '57017'
      ZX_TEST_MONGO_DB: zerux_lab
      LAB_REDIS_HOST: '127.0.0.1'
      LAB_REDIS_PORT: '56379'
      CACHE_REDIS_URL: redis://127.0.0.1:56379
      QUEUE_REDIS_URL: redis://127.0.0.1:56379
      LAB_S3_HOST: '127.0.0.1'
      LAB_S3_PORT: '59000'
      LAB_S3_ENDPOINT: http://127.0.0.1:59000
      LAB_S3_BUCKET: zerux-lab
      LAB_S3_EPHEMERAL_BUCKET: '1'
      LAB_S3_ACCESS_KEY: minio_lab_only
      LAB_S3_SECRET_KEY: minio_lab_secret_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/proworkspace/package-lock.json
      - name: Start isolated loopback-only service fixtures
        run: docker compose -f integration-lab/compose.yml -p zerux-section83 up -d --wait --wait-timeout 180
      - name: Print test service image versions
        run: docker compose -f integration-lab/compose.yml -p zerux-section83 images
      - name: Clean install (must pass before live certification)
        run: npm ci --no-audit --no-fund
      - name: Compile tested package scopes
        run: node scripts/integration-lab.mjs --only=auth,sqlite,pipeline,content --build --require=auth,sqlite,pipeline,content --report=integration-lab/reports/sqlite.json
      - name: Run real provider matrix (requires each configured service)
        run: node scripts/integration-lab.mjs --only=pg,mysql,mongo,redis-cache,redis-queue,s3 --build --require=pg,mysql,mongo,redis-cache,redis-queue,s3 --report=integration-lab/reports/real.json
      - name: Preserve live evidence even after a failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-real-service-evidence
          path: apps/proworkspace/integration-lab/reports/*.json
          if-no-files-found: ignore
      - name: Always dismantle disposable service fixtures
        if: always()
        run: docker compose -f integration-lab/compose.yml -p zerux-section83 down --volumes --remove-orphans
